<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Web_Test_Report</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; padding: 40px; }
    .container { max-width: 800px; margin: 0 auto; background: #161b22; padding: 30px; border-radius: 8px; border: 1px solid #30363d; }
    h1 { color: #58a6ff; border-bottom: 1px solid #30363d; padding-bottom: 10px; }
    .stat-box { display: flex; justify-content: space-between; background: #21262d; padding: 20px; border-radius: 6px; margin: 20px 0; }
    .stat { text-align: center; }
    .stat-val { font-size: 24px; font-weight: bold; color: #7ee787; }
    .stat-label { font-size: 12px; color: #8b949e; text-transform: uppercase; }
    a { color: #58a6ff; text-decoration: none; }
    a:hover { text-decoration: underline; }
    ul { list-style: none; padding: 0; }
    li { background: #21262d; margin-bottom: 10px; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="container">
    <h1>📄 Web Test Report</h1>
    
    <div class="stat-box">
      <div class="stat"><div class="stat-val">320</div><div class="stat-label">Total</div></div>
      <div class="stat"><div class="stat-val">320</div><div class="stat-label">Passed</div></div>
      <div class="stat"><div class="stat-val" style="color:#ff7b72;">0</div><div class="stat-label">Failed</div></div>
      <div class="stat"><div class="stat-val">0</div><div class="stat-label">Skipped</div></div>
      <div class="stat"><div class="stat-val" style="color:#a5d6ff;">100.0%</div><div class="stat-label">Pass Rate</div></div>
    </div>

    
    
    <div style="margin-top: 30px; text-align: center;">
      <a href="index.html">← Back to Dashboard</a>
    </div>
  </div>
</body>
</html>
